name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared development dependencies
        run: python -m pip install '.[dev]'
      - name: Run the complete regular suite with skip reasons
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output/ci/python | Out-Null
          python -m pytest -q -ra tests --junitxml=output/ci/python/junit.xml 2>&1 | Tee-Object output/ci/python/pytest.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the cursor frequency project baseline
        shell: pwsh
        run: |
          python examples/cursor-frequency-demo/verification/verify.py --out-dir output/ci/cursor 2>&1 | Tee-Object output/ci/python/cursor.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: python-${{ matrix.python }}-windows
          path: output/ci/
          if-no-files-found: warn
          retention-days: 14

  wheel:
    name: Independent wheel / Python 3.10 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Verify the installed wheel without source imports or q1simulator
        run: python tools/verify_simulation_wheel.py --wheel 'dist/q1lens-*.whl' --out output/ci/wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: independent-wheel-python-3.10
          path: |
            output/ci/wheel/
            dist/*.whl
          if-no-files-found: warn
          retention-days: 14

  extension-unit:
    name: Extension unit / Node 24 / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies for environment probe tests
        run: python -m pip install .
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - name: Run extension unit tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../output/ci/extension-unit | Out-Null
          npm test -- --reporter xunit --reporter-option output=../output/ci/extension-unit/junit.xml 2>&1 | Tee-Object ../output/ci/extension-unit/unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extension-unit-windows
          path: output/ci/extension-unit/
          if-no-files-found: warn
          retention-days: 14

  notebook-onboarding-linux:
    name: Python environment onboarding / Node 24 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies for environment probe tests
        run: python -m pip install .
        working-directory: .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run compile
      - name: Test Python environment selection, setup, and native POSIX commands
        run: npx mocha out/test/pythonEnvironment.test.js out/test/fileEnvironment.test.js out/test/taskProvider.test.js out/test/notebookEnvironment.test.js out/test/notebookInstallCommand.test.js out/test/environment.test.js
      - name: Test original notebook and file environments through analysis and refresh
        run: npx mocha out/test/commands.test.js --grep "uses the original notebook's current kernel|Python for file schedules and refreshes the original file"

  extension-host:
    name: VS Code ${{ matrix.vscode }} / Windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.90.0', stable]
    env:
      Q1LENS_VSCODE_TEST_VERSION: ${{ matrix.vscode }}
      Q1LENS_EXTENSION_HOST_OUTPUT: ${{ github.workspace }}/output/ci/extension-host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: python -m pip install '.[dev]'
      - run: npm ci
        working-directory: vscode-extension
      - name: Run the actual extension host
        working-directory: vscode-extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../output/ci/extension-host | Out-Null
          npm run test:extension 2>&1 | Tee-Object ../output/ci/extension-host/host.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: extension-host-${{ matrix.vscode }}-windows
          path: output/ci/extension-host/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser DOM / Chromium / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      Q1LENS_BROWSER_OUTPUT: ${{ github.workspace }}/output/ci/browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: python -m pip install '.[dev]'
      - run: npm ci
        working-directory: vscode-extension
      - run: npx playwright install --with-deps chromium
        working-directory: vscode-extension
      - name: Run the browser DOM checks
        run: npm run test:browser
        working-directory: vscode-extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-chromium-ubuntu
          path: output/ci/browser/
          if-no-files-found: warn
          retention-days: 14
