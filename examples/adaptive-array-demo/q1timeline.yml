params:
  file: params.json

alignment:
  mode: first_wait_trigger

view:
  default_mode: debug
  show_q1_issue: true
  show_queue: true
  show_slack: true
  show_loop_preview: true

analysis:
  loop_policy: compact_first_iteration
  branch_policy: assume_fallthrough
  underflow_policy: confidence_levels
