sequencers:
  - id: qcm_marker
    name: Marker gate
    file: qcm_marker.q1asm
    module: QCM0
  - id: qrm_scope
    name: Scope acquire
    file: qrm_scope.q1asm
    module: QRM0

alignment:
  mode: first_wait_sync

view:
  default_mode: debug
  show_q1_issue: true
  show_queue: true
  show_slack: true
  show_loop_preview: false

analysis:
  loop_policy: compact_first_iteration
  branch_policy: assume_fallthrough
  underflow_policy: confidence_levels
