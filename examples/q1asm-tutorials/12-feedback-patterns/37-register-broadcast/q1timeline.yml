sequencers:
  - id: producer
    name: Feedback producer
    file: producer.q1asm
    module: QCM0
  - id: consumer
    name: Feedback consumer
    file: consumer.q1asm
    module: QRM0

alignment:
  mode: first_wait_sync

view:
  default_mode: normal
  show_q1_issue: false
  show_queue: false
  show_slack: false
  show_loop_preview: true

analysis:
  loop_policy: compact_first_iteration
  branch_policy: assume_fallthrough
  underflow_policy: confidence_levels
