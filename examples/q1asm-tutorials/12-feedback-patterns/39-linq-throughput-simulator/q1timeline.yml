sequencers:
  - id: burst_producer
    name: Burst register producer
    file: burst_producer.q1asm
    module: QCM0
  - id: burst_consumer
    name: Delayed burst drain
    file: burst_consumer.q1asm
    module: QRM0
  - id: iq_producer
    name: IQ acquisition feedback producer
    file: iq_producer.q1asm
    module: QRM1
  - id: iq_consumer
    name: IQ feedback drain
    file: iq_consumer.q1asm
    module: QCM1

alignment:
  mode: first_wait_sync

view:
  default_mode: debug
  show_q1_issue: true
  show_queue: true
  show_slack: true
  show_loop_preview: false

analysis:
  loop_policy: compact_first_iteration
  branch_policy: assume_fallthrough
  underflow_policy: confidence_levels
