sequencers:
  - id: client_a
    name: Client A request and grant wait
    file: client_a.q1asm
    module: QCM0
  - id: client_b
    name: Client B request and grant wait
    file: client_b.q1asm
    module: QCM1
  - id: arbiter
    name: Feedback arbiter
    file: arbiter.q1asm
    module: QRM0

alignment:
  mode: first_wait_sync

view:
  default_mode: normal
  show_q1_issue: false
  show_queue: false
  show_slack: false
  show_loop_preview: true

analysis:
  loop_policy: compact_first_iteration
  branch_policy: assume_fallthrough
  underflow_policy: confidence_levels
