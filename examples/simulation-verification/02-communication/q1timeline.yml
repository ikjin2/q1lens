analysis:
  execution_mode: simulation
alignment:
  mode: none
simulation:
  startup_delay_ns: 200
  max_time_ns: 5000
  routes:
    - source: sender
      target: receiver
      id: 16
      latency_ns: 24
  inputs:
    triggers:
      - target: receiver
        time_ns: 1100
        address: 1
sequencers:
  - id: sender
    module: QCM0
    file: sender.q1asm
  - id: receiver
    module: QRM0
    file: receiver.q1asm
