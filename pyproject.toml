[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "q1lens"
version = "0.1.1"
description = "Cross-layer scheduler and Q1ASM debugger for Qblox workflows"
readme = "README.md"
authors = [
  { name = "Ik Kyeong Jin" },
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/ikjin2/q1lens"
Repository = "https://github.com/ikjin2/q1lens.git"
Issues = "https://github.com/ikjin2/q1lens/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
q1lens = "q1lens.cli:main"
qbstimeline = "qbstimeline.cli:main"
q1timeline = "q1timeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
